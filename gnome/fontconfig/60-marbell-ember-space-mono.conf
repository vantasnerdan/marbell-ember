<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep Space Mono for text. Resolve private-use Nerd glyphs before
       unrelated symbol fonts that reuse the same Unicode codepoints. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Space Mono</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>MesloLGM Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
