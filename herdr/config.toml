# Marbell Ember — herdr
onboarding = false

[theme]
# "terminal" follows the host palette (Ghostty's Marbell Ember); the tokens below pin the chrome.
name = "terminal"

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
surface_dim = "#0A0F1D"
surface0 = "#111829"
surface1 = "#1E2A44"
active_row_bg = "#1E2A44"
selection_bg = "#26365A"
overlay0 = "#5B6B8C"
overlay1 = "#7C8BAA"
subtext0 = "#9AA8C2"
text = "#C9D3E3"
accent = "#F47853"
peach = "#FF9A7B"
mauve = "#F47853"
red = "#E5484D"
yellow = "#F2B866"
green = "#4FD1C5"
teal = "#4FD1C5"
blue = "#6E9BF5"

[terminal]
# Interactive panes get xonsh; $SHELL stays bash so agents that shell out are unaffected.
default_shell = "__HOME__/.local/bin/xonsh"

[ui]
accent = "#F47853"
status_indicators = "symbols"
pane_gaps = true
pane_scrollbars = false
show_agent_labels_on_pane_borders = true
tab_bar_right = [{ type = "text", text = "marbell" }, { type = "datetime", format = "%H:%M" }]
tab_bar_right_separator = " · "
window_title = "{workspace} · {tab}"

# Sidebar: no slab (the glass shows through), and rows in the Ember colours.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#F4F7FB", bold = true }],
  [{ token = "branch", fg = "#4FD1C5" }, { token = "git_status", fg = "#F2B866" }],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "agent", fg = "#F47853", bold = true }, { token = "state_text", fg = "#5B6B8C" }],
  [{ token = "workspace", fg = "#C9D3E3" }, { token = "tab", fg = "#5B6B8C" }],
  [{ token = "terminal_title_stripped", fg = "#5B6B8C" }],
]

[[keys.command]]
key = "prefix+alt+b"
type = "popup"
command = "btop"
width = "85%"
height = "85%"
